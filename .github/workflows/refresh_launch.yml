name: Refresh launches

on:
  schedule:
    # Runs daily at 13:00 UTC (9am ET / 6am PT). Adjust as you like.
    - cron: '0 13 * * *'
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab

permissions:
  contents: write   # needed so the workflow can push the updated JSON back

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run fetch script
        run: |
          mkdir -p data
          python scripts/fetch_launches.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/launches.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update launches.json [skip ci]"
            git push
          fi
